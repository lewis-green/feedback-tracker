services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: issue_tracker
      POSTGRES_PASSWORD: issue_tracker
      POSTGRES_DB: issue_tracker
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
